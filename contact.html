<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Work With Me | Knight Arcenas</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)),
              url('./background-v2.png') no-repeat center center/cover;
}

.bg-video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -1;
}
</style>
</head>

<body class="text-white flex items-center justify-center min-h-screen px-6">

<div class="bg-black/60 backdrop-blur-lg p-8 rounded-2xl w-full max-w-xl border border-gray-800">

  <h1 class="text-3xl font-bold mb-6 text-center">
    Work With Me
  </h1>

  <!-- Contact Form -->
  <form action="https://formsubmit.co/arcenasv@gmail.com" method="POST" class="space-y-4">

  <input type="hidden" name="_next" value="https://knightarcenas.github.io/thankyou.html">

  <input type="hidden" name="_subject" value="New Client Inquiry from Portfolio">

  <input type="hidden" name="_template" value="table">

  <input type="hidden" name="_captcha" value="false">

  <input type="text" name="name" required
    placeholder="Your Name"
    class="w-full p-3 rounded-lg bg-gray-900 border border-gray-700 focus:outline-none">

  <input type="email" name="email" required
    placeholder="Your Email"
    class="w-full p-3 rounded-lg bg-gray-900 border border-gray-700 focus:outline-none">

  <textarea name="message" required
    placeholder="Message"
    rows="5"
    class="w-full p-3 rounded-lg bg-gray-900 border border-gray-700 focus:outline-none"></textarea>

  <button type="submit"
    class="w-full bg-blue-500 py-3 rounded-xl hover:bg-blue-600 transition">
    Send Message
  </button>

</form>

  <!-- Success Message -->
  <div id="successMessage" class="hidden text-center">

    <div class="text-blue-400 text-5xl mb-5">
      ✓
    </div>

    <h2 class="text-3xl font-bold mb-4">
      Message Sent!
    </h2>

    <p class="text-gray-300 mb-8">
      Thanks for reaching out. I’ll get back to you soon.
    </p>

    <a
      href="index.html"
      class="inline-block bg-blue-500 px-6 py-3 rounded-xl hover:bg-blue-600 transition"
    >
      Back to Home
    </a>

  </div>

  <!-- Error Message -->
  <p
    id="errorMessage"
    class="hidden text-red-400 text-sm text-center mt-4"
  >
    Something went wrong. Please try again.
  </p>

  <!-- Back -->
  <div id="backLink" class="text-center mt-6">
    <a
      href="index.html"
      class="text-gray-400 hover:text-white text-sm"
    >
      ← Back to Home
    </a>
  </div>

</div>

<!-- Background Video -->
<video autoplay muted loop playsinline class="bg-video">
  <source src="./myvideov2.mp4" type="video/mp4">
</video>


<script>
const form = document.getElementById("contactForm");
const submitButton = document.getElementById("submitButton");
const successMessage = document.getElementById("successMessage");
const errorMessage = document.getElementById("errorMessage");
const backLink = document.getElementById("backLink");

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  submitButton.disabled = true;
  submitButton.textContent = "Sending...";
  errorMessage.classList.add("hidden");

  const formData = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    message: document.getElementById("message").value,
    _subject: "New Client Inquiry from Portfolio",
    _template: "table",
    _captcha: "false"
  };

  try {

    const response = await fetch(
      "https://formsubmit.co/ajax/arcenasv@gmail.com",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },

        body: JSON.stringify(formData)
      }
    );

    const result = await response.json();

    if (response.ok) {

      form.classList.add("hidden");
      backLink.classList.add("hidden");
      successMessage.classList.remove("hidden");

    } else {

      throw new Error(result.message || "Submission failed");

    }

  } catch (error) {

    console.error(error);

    submitButton.disabled = false;
    submitButton.textContent = "Send Message";
    errorMessage.classList.remove("hidden");

  }

});
</script>

</body>
</html>
