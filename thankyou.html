<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Message Sent | Knight Arcenas</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)),
                  url('./background-v2.png') no-repeat center center/cover;
    }

    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }
  </style>
</head>

<body class="text-white flex items-center justify-center min-h-screen px-6">

  <!-- Background Video -->
  <video autoplay muted loop playsinline class="bg-video">
    <source src="./myvideov2.mp4" type="video/mp4">
  </video>

  <!-- Thank You Card -->
  <div class="bg-black/60 backdrop-blur-lg p-10 rounded-2xl text-center border border-gray-800 w-full max-w-xl">

    <div class="text-blue-400 text-5xl mb-5">
      ✓
    </div>

    <h1 class="text-4xl font-bold mb-4">
      Message Sent!
    </h1>

    <p class="text-gray-300 mb-8">
      Thanks for reaching out. I’ll get back to you soon.
    </p>

    <a href="index.html"
       class="inline-block bg-blue-500 px-6 py-3 rounded-xl hover:bg-blue-600 transition">
      Back to Home
    </a>

  </div>

</body>
</html>
